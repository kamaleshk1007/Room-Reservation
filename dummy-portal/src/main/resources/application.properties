spring.application.name=dummy-portal

# Load dummy-portal/.env when running locally. The file is gitignored.
spring.config.import=optional:file:.env[.properties]

server.port=${PORTAL_PORT:8090}

# Database
spring.datasource.url=${PORTAL_DB_URL:jdbc:mysql://localhost:3306/dummy_portal}
spring.datasource.username=${PORTAL_DB_USERNAME}
spring.datasource.password=${PORTAL_DB_PASSWORD}

# Flyway: dummy_portal already contains tables from another project (branches, users),
# so baseline at version 0 to let V1 (portal_users) apply without touching them.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dummy portal cookie
portal.cookie-secret=${PORTAL_COOKIE_SECRET}
portal.cookie-secure=${PORTAL_COOKIE_SECURE:false}
portal.session-ttl-seconds=${PORTAL_SESSION_TTL_SECONDS:28800}

# Seed credentials (used only when the seed users are missing)
portal.seed.hod.password=${PORTAL_SEED_HOD_PASSWORD}
portal.seed.staff.password=${PORTAL_SEED_STAFF_PASSWORD}
portal.seed.staff002.password=${PORTAL_SEED_STAFF002_PASSWORD}
