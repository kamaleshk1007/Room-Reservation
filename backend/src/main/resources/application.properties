spring.application.name=room-reservation

# Load backend/.env when running locally. The file is gitignored.
spring.config.import=optional:file:.env[.properties]

# HTTP server
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/room_reservation}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:30}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized