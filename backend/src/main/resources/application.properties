spring.application.name=room-reservation

# Load backend/.env when running locally. The file is gitignored.
spring.config.import=optional:file:.env[.properties]

# HTTP server
server.address=0.0.0.0
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=2

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Portal cookie SSO. Optional: when PORTAL_COOKIE_SECRET is unset the app still
# boots and the /api/auth/portal-sso endpoint returns 503 (not configured).
app.portal.cookieSecret=${PORTAL_COOKIE_SECRET:}

# Cookie Secure flag for login refresh cookies. true in production (HTTPS), false locally.
app.cookie.secure=${COOKIE_SECURE:false}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:30}
app.jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized