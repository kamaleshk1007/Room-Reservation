spring.application.name=room-reservation

# Load backend/.env when running locally. The file is gitignored.
spring.config.import=optional:file:.env

# HTTP server
server.port=${SERVER_PORT:8080}

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/room_reservation
spring.datasource.username=room_user
spring.datasource.password=room_password

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=room_user
spring.flyway.password=room_password
spring.flyway.baseline-on-migrate=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized